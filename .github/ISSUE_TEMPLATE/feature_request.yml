name: Feature request
description: An idea or an improvement for OksaSDR
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea! Check the [roadmap](https://github.com/OH6OKSA/OksaSDR/blob/mobile/oksasdr/mobile/ROADMAP.md)
        first: it may be planned already. Ideas are also welcome in the
        [OksaSDR Users group](https://www.facebook.com/groups/1468327561855382).
  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: What the app should do, and where (which page, tab or button).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: How you operate and what it would help with; how SmartSDR, AetherSDR or another program does it, if one does.
  - type: input
    id: device
    attributes:
      label: Device and radio
      description: e.g. iPad mini, FLEX-6400
