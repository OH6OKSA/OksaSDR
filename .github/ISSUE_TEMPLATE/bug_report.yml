name: Bug report
description: Something in OksaSDR (iPhone, iPad, Mac or Android) does not work right
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve OksaSDR! The app's log tells most:
        right after the problem, open **Log** in the top row (on an iPhone
        behind **⋯**), tap **Copy** and paste it below, or email it to
        oh6oksa@gmail.com if you would rather not post it.
        This tracker is for the OksaSDR app; the desktop AetherSDR has its
        own at https://github.com/aethersdr/AetherSDR/issues.
  - type: input
    id: build
    attributes:
      label: App version and build
      description: In the app's top row, e.g. 26.10.2 (113) on TestFlight or (28) for Android beta 28.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system
      description: e.g. iPhone 15 Pro, iOS 26.6; iPad Pro 11 M5; MacBook Air M2; Samsung S22, Android 15
    validations:
      required: true
  - type: input
    id: radio
    attributes:
      label: Radio
      description: Model and SmartSDR version, e.g. FLEX-6600 3.10.15, Aurora AU-510
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Home network (IP address)
        - SmartLink
        - VPN (WireGuard, OpenVPN, Tailscale …)
        - Other / not sure
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The steps that lead to it help most (band, mode, which tab or button).
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Log → Copy right after it happened. Screenshots or a screen recording help too (drag them here).
      render: text
