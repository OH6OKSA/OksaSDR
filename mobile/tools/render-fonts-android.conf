<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  For render-tool runs that stand in for an Android phone: start aether-mobile with the environment variable
  FONTCONFIG_FILE set to this file (and the window size and default text size of the phone).

  The app asks for the family "monospace" (the frequency, the decode lists). An Android phone draws that with
  Roboto: digits 0.56 em wide, a dot 0.26 em. A Linux desktop draws it with its monospace font, 0.6 em for every
  character, so "14.074.000" is 31 px wider at 30 px and a 344 pt wide page ran 18 px past the window in a render
  (the right edge cut) where the phone shows it whole. Liberation Sans has Arial's metrics (0.556 and 0.278 em).
  The match comes before the system's rules, so "monospace" never reaches their aliases.

  With it, give the default text size (the font-px option) as the phone's: about 14 px times the system text
  size (16 at 115 %, 18 at 130 %, 19 at 135 %), and the text size itself as OKSASDR_TEXT_SCALE.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
